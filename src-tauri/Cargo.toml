[package]
name = "cl"
version = "0.1.2"
description = "Import and browse an iPhone's data on a desktop."
edition = "2021"
rust-version = "1.77"

[lib]
name = "cl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Backup reading. `bundled` compiles SQLite in, so the app does not depend on
# whatever version the host OS happens to ship — important for the live image.
plist = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

# Backup decryption.
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false }
sha1 = "0.10"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
tempfile = "3"

# Photo decoding. heif-oxide is pure Rust (MIT/Apache-2.0) and pulls in no C
# library, so CI is unchanged on all three platforms; measured cost is +339 KB
# against a libheif binding's ~1.5 MB plus a system package per platform.
heif-oxide = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
# Tuned for the live-USB build: small binary, no debug symbols, LTO on.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
