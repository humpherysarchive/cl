[package]
name = "cl"
version = "0.1.0"
description = "Import and browse an iPhone's data on a desktop."
edition = "2021"
rust-version = "1.77"

[lib]
name = "cl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Tuned for the live-USB build: small binary, no debug symbols, LTO on.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
